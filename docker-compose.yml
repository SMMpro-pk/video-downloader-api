services:
  video-downloader-api:
    build: .
    container_name: video-downloader-api
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - RATE_LIMIT_MAX=${RATE_LIMIT_MAX:-100}
      - CACHE_TTL_MINUTES=${CACHE_TTL_MINUTES:-60}
      - CACHE_MAX_SIZE=${CACHE_MAX_SIZE:-500}
      - MAX_CONCURRENT=${MAX_CONCURRENT:-5}
      - MAX_VIDEO_DURATION=${MAX_VIDEO_DURATION:-7200}
      - MAX_FILE_SIZE_MB=${MAX_FILE_SIZE_MB:-500}
      - MAX_FORMATS=${MAX_FORMATS:-10}
      - API_SECRET_KEY=${API_SECRET_KEY:-}
      - AUTO_GENERATE_API_KEY=${AUTO_GENERATE_API_KEY:-true}
      - PROXY_URL=${PROXY_URL:-}
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
